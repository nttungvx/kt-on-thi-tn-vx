<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phòng Thi Tốt Nghiệp THPT</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, chtml: { scale: 1.1, minScale: 0.5 }, startup: { typeset: false } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        html { background-color: #f8fafc; font-family: 'Inter', sans-serif; touch-action: pan-y; }
        html.dark { background-color: #000000; }
        body { transition: background-color 0.3s; }
        .dark body { background-color: #000000; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #27272a; }
        input[type="radio"] { -webkit-appearance: none; appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #94a3b8; border-radius: 50%; background-color: #ffffff; cursor: pointer; position: relative; display: inline-block; vertical-align: middle; margin-top: 0 !important; }
        input[type="radio"]:checked { border-color: #2563eb; background-color: #2563eb; }
        input[type="radio"]:checked::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0.5rem; height: 0.5rem; border-radius: 50%; background-color: #ffffff; }
        .dark input[type="radio"] { background-color: #18181b; border-color: #52525b; }
        .locked { pointer-events: none; opacity: 0.95; }
        .question-img { max-height: 40vh; object-fit: contain; margin: 1rem auto; border-radius: 0.5rem; display: block; border: 1px solid #e2e8f0; }
        .dark .question-img { border-color: #27272a; background-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-black text-slate-800 dark:text-slate-200 h-[100dvh] w-screen overflow-hidden flex flex-col justify-center items-center">

    <div id="fullscreen-overlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[9999] flex flex-col items-center justify-center p-6 text-center transition-all duration-300">
        <i id="fs-icon" class="fa-solid fa-expand text-6xl text-blue-500 mb-6 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]"></i>
        <h2 id="fs-title" class="text-3xl font-black text-white mb-4 tracking-wide uppercase">CHẾ ĐỘ THI NGHIÊM TÚC</h2>
        <p id="fs-desc" class="text-slate-300 mb-8 max-w-md text-lg">Bài thi yêu cầu làm trong chế độ Toàn màn hình để đảm bảo công bằng. Mọi hành vi thoát màn hình hoặc chuyển tab sẽ bị cảnh báo.</p>
        <button id="fs-btn" onclick="enterFullscreen()" class="px-10 py-5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-all text-xl outline-none">VÀO PHÒNG THI</button>
    </div>

    <div id="main-layout" class="w-full h-full relative flex flex-col overflow-hidden z-10 max-w-[1600px] mx-auto">
        <div id="start-screen" class="w-full h-full flex flex-col items-center justify-center p-4">
            <div class="bg-white/90 dark:bg-black/90 p-10 rounded-2xl shadow-xl border border-slate-200 dark:border-zinc-800 text-center w-full max-w-lg">
                <i class="fa-solid fa-graduation-cap text-6xl text-blue-600 mb-6 block"></i>
                <h1 id="loading-txt" class="text-2xl font-bold text-slate-800 dark:text-white mb-4"><svg class="animate-spin h-6 w-6 inline-block mr-2 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>ĐANG TẢI DỮ LIỆU ĐỀ THI...</h1>
                <p class="text-slate-500" id="exam-id-display">Đang đồng bộ máy chủ...</p>
            </div>
        </div>

        <div id="exam-screen" class="hidden h-full flex flex-col w-full relative">
            <header class="flex-none bg-white dark:bg-black border-b border-slate-200 dark:border-zinc-800 flex items-center justify-between px-4 py-3 z-30">
                <h2 class="text-lg md:text-xl font-bold text-blue-700 dark:text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice"></i> <span id="header-title">Đề Thi</span>
                </h2>
                
                <div class="flex items-center gap-3">
                    <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 px-4 py-2 rounded-lg font-bold text-blue-700 dark:text-blue-400 text-lg md:text-xl tracking-wider" id="timer">00:00:00</div>
                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-zinc-700 shadow-sm outline-none transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 theme-icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 theme-icon-sun hidden text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </button>
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden w-full relative">
                <div class="flex-1 flex flex-col relative overflow-hidden">
                   <div class="flex-1 overflow-y-auto p-4 md:p-8" id="scroll-container">
                        <div class="w-full max-w-4xl mx-auto">
                            <div class="mb-6 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 px-4 py-1.5 rounded-lg font-bold text-sm inline-block" id="current-question-label">PHẦN 1 - CÂU 1</div>
                            <div id="question-container" class="text-slate-800 dark:text-slate-100 text-base md:text-lg"></div>
                        </div>
                    </div>
                    <div class="flex-none bg-white dark:bg-black border-t border-slate-200 dark:border-zinc-800 flex justify-between p-3 gap-2 z-10">
                        <button onclick="prevQuestion()" class="flex-1 max-w-[150px] py-3 bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 rounded-lg font-bold transition outline-none">Trở lại</button>
                        <button onclick="nextQuestion()" class="flex-1 max-w-[150px] py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md transition outline-none">Câu sau</button>
                    </div>
                </div>
                
                <div id="sidebar-menu" class="hidden md:flex flex-col w-[320px] bg-white dark:bg-black border-l border-slate-200 dark:border-zinc-800 shadow-2xl md:shadow-none z-20">
                    <div class="p-5 border-b border-slate-200 dark:border-zinc-800">
                        <div class="flex justify-between text-sm text-slate-600 dark:text-slate-400 font-bold uppercase mb-2">
                            <span>Tiến độ</span><span id="progress-text">0%</span>
                        </div>
                        <div class="w-full bg-slate-200 dark:bg-zinc-800 rounded-full h-2.5 overflow-hidden flex">
                            <div id="pb-completed" class="bg-emerald-500 h-full transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-5" id="minimap-container"></div>
                    <div class="p-5 border-t border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-950" id="sidebar-footer">
                        <button onclick="finishExam()" id="btn-submit-exam" class="w-full py-4 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg transition text-lg tracking-wide outline-none">NỘP BÀI THI</button>
                    </div>
                </div>
            </div>
        </div>
    </div> 

    <script>
        function enterFullscreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(err => console.log(err)); } 
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
            
            document.getElementById('fullscreen-overlay').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => document.getElementById('fullscreen-overlay').classList.add('hidden'), 300);
            
            if (examConfig === null) initApp();
        }

        document.addEventListener('fullscreenchange', checkFullscreen);
        document.addEventListener('webkitfullscreenchange', checkFullscreen);
        document.addEventListener('msfullscreenchange', checkFullscreen);

        function checkFullscreen() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen && !document.mozFullScreen && !document.msFullscreenElement) {
                if (!isExamFinished) {
                    let overlay = document.getElementById('fullscreen-overlay');
                    overlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                    document.getElementById('fs-icon').className = "fa-solid fa-triangle-exclamation text-6xl text-rose-500 mb-6 drop-shadow-[0_0_15px_rgba(225,29,72,0.5)]";
                    document.getElementById('fs-title').innerText = "CẢNH BÁO VI PHẠM";
                    document.getElementById('fs-title').className = "text-3xl font-black text-rose-500 mb-4 tracking-wide uppercase";
                    document.getElementById('fs-desc').innerText = "Bạn đã thoát chế độ toàn màn hình. Yêu cầu quay lại ngay để tiếp tục bài thi!";
                    document.getElementById('fs-btn').innerText = "QUAY LẠI BÀI THI";
                    document.getElementById('fs-btn').className = "px-10 py-5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl shadow-[0_0_20px_rgba(225,29,72,0.4)] transition-all text-xl outline-none";
                }
            }
        }

        try {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch(e) {}

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); } catch(e) {}
            updateThemeIcons();
        }
        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.theme-icon-moon').forEach(el => el.classList.toggle('hidden', isDark));
            document.querySelectorAll('.theme-icon-sun').forEach(el => el.classList.toggle('hidden', !isDark));
        }
        updateThemeIcons();

        let examConfig = null; let allQuestions = []; let currentIndex = 0; let userAnswers = {}; 
        let timeLimitSeconds = 0; let totalSecondsSpent = 0; let timerInterval; let isExamFinished = false;
        const alphabet = ['A','B','C','D','E','F'];

        function initApp() {
            let madeCode = new URLSearchParams(window.location.search).get('made');
            if(!madeCode) { 
                document.getElementById('loading-txt').innerHTML = "<span class='text-rose-500'>❌ Lỗi: Không nhận được mã đề!</span>"; 
                document.getElementById('exam-id-display').innerText = "Vui lòng thoát ra và đăng nhập lại.";
                return; 
            }
            fetchFromGitHub(madeCode);
        }

        async function fetchFromGitHub(madeId) {
            const owner = "nttungvx"; const repo = "kt-on-thi-tn-vx"; 
            document.getElementById('exam-id-display').innerHTML = "Đang tải dữ liệu từ GitHub...";
            try {
                const directUrl = `https://${owner}.github.io/${repo}/data/${encodeURIComponent(madeId)}.json`;
                const resDirect = await fetch(directUrl);
                if (resDirect.ok) { examConfig = await resDirect.json(); processExamDataJSON(); return; }
                
                const resList = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data`);
                if (!resList.ok) throw new Error(`Mã lỗi: ${resList.status}`);
                const files = await resList.json();
                
                function khongDau(s) {
                    if (!s) return ""; let str = s.toString().toLowerCase().replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a").replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e").replace(/ì|í|ị|ỉ|ĩ/g, "i").replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o").replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u").replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y").replace(/đ/g, "d").replace(/[\u0300-\u036f]/g, ""); return str.replace(/\.json$/i, '').trim();
                }
                
                let target = khongDau(madeId);
                const fileTarget = files.find(f => khongDau(f.name) === target || khongDau(f.name).startsWith(target + "_"));
                if (!fileTarget) throw new Error(`Không tìm thấy đề [${madeId}]`);

                const resData = await fetch(fileTarget.download_url);
                examConfig = await resData.json();
                processExamDataJSON();
            } catch(e) { 
                document.getElementById("loading-txt").innerHTML = `<span class="text-rose-500">❌ LỖI TẢI ĐỀ</span>`;
                document.getElementById('exam-id-display').innerHTML = e.message;
            }
        }

        function processExamDataJSON() {
            allQuestions = []; timeLimitSeconds = examConfig.timeLimit || 5400;
            if (examConfig.part1) examConfig.part1.forEach((q, i) => allQuestions.push({...q, type: 1, p: 1, idx: i}));
            if (examConfig.part2) examConfig.part2.forEach((q, i) => allQuestions.push({...q, type: 2, p: 2, idx: i}));
            if (examConfig.part3) examConfig.part3.forEach((q, i) => allQuestions.push({...q, type: 3, p: 3, idx: i}));

            document.getElementById('header-title').innerText = examConfig.title || "Bài thi";
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            buildMinimap(); startTimer(); goToQuestion(0);
        }

        function calculateScore(q, idx) {
            let ans = userAnswers[idx];
            if(q.type === 1) return (ans === q.ans) ? (examConfig.p1_points || 0.25) : 0;
            if(q.type === 2) { 
                let count = 0; 
                for(let i=0; i<4; i++) { if(ans && ans[i] === q.ans[i]) count++; } 
                let p2_arr = examConfig.p2_points || [0.1, 0.25, 0.5, 1.0];
                return (count > 0) ? p2_arr[count - 1] : 0; 
            }
            if(q.type === 3) { 
                let u = (ans || []).join('').trim().replace(',', '.');
                let g = q.ans.toString().trim().replace(',', '.');
                return (u === g) ? (examConfig.p3_points || 0.5) : 0; 
            }
            return 0;
        }

        function goToQuestion(idx) {
            if(idx < 0 || idx >= allQuestions.length) return;
            currentIndex = idx;
            document.getElementById('current-question-label').innerText = `PHẦN ${allQuestions[idx].p} - CÂU ${allQuestions[idx].idx + 1}`;
            renderQuestion(); updateMinimapHighlight(); document.getElementById('scroll-container').scrollTop = 0;
        }

        function prevQuestion() { goToQuestion(currentIndex - 1); }
        function nextQuestion() { goToQuestion(currentIndex + 1); }

        // CÁC HÀM LƯU ĐÁP ÁN CHO TỪNG PHẦN
        function saveAnswer(val) { userAnswers[currentIndex] = val; updateProgress(); }
        
        function saveAnswer2(subIndex, val) {
            if (!userAnswers[currentIndex]) userAnswers[currentIndex] = [];
            userAnswers[currentIndex][subIndex] = val;
            updateProgress();
        }
        
        function saveAnswer3(val) {
            userAnswers[currentIndex] = [val]; 
            updateProgress();
        }

        function renderQuestion() {
            const q = allQuestions[currentIndex]; const isLocked = isExamFinished;
            let html = `<div class="${isLocked ? 'locked' : ''} mb-6 leading-relaxed text-lg font-medium">${q.q}</div>`;
            if (q.image && q.image !== "[CẦN_CHÈN_ẢNH]") html += `<img src="${q.image}" class="question-img">`;

            let saved = userAnswers[currentIndex] || (q.type === 2 ? [] : (q.type === 3 ? [] : null));

            // PHẦN 1: TRẮC NGHIỆM
            if (q.type === 1) {
                html += `<div class="grid gap-3">`;
                q.options.forEach((opt, i) => {
                    let checked = saved === i ? 'checked' : '';
                    let extraClass = "border-slate-200 dark:border-zinc-800 hover:bg-slate-50 dark:hover:bg-zinc-900";
                    let textClass = "";

                    if (isLocked) {
                        if (q.ans === i) {
                            extraClass = "border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20";
                            textClass = "text-emerald-700 dark:text-emerald-400 font-bold";
                        } else if (saved === i) {
                            extraClass = "border-rose-500 bg-rose-50 dark:bg-rose-900/20";
                            textClass = "text-rose-700 dark:text-rose-400 font-bold";
                        } else {
                            extraClass = "border-slate-200 dark:border-zinc-800 opacity-50";
                        }
                    }

                    html += `<label class="flex items-center p-4 border rounded-lg cursor-pointer transition ${extraClass}">
                                <input type="radio" name="p1" value="${i}" ${checked} class="mr-3" onchange="saveAnswer(${i})" ${isLocked?'disabled':''}>
                                <span class="flex-1 font-medium ${textClass}"><b>${alphabet[i]}.</b> ${opt}</span>
                             </label>`;
                });
                html += `</div>`;
            } 
            // PHẦN 2: BẢNG CHỌN ĐÚNG / SAI
            else if (q.type === 2) {
                let rowLabels = ['a', 'b', 'c', 'd'];
                html += `<div class="overflow-x-auto border border-slate-200 dark:border-zinc-800 rounded-xl shadow-sm mt-4">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800">
                                        <th class="p-4 font-bold text-slate-700 dark:text-slate-300">Phát biểu</th>
                                        <th class="p-4 font-bold text-emerald-600 text-center w-24">Đúng</th>
                                        <th class="p-4 font-bold text-rose-500 text-center w-24">Sai</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                q.options.forEach((opt, i) => {
                    let sT = saved[i] === 'T' ? 'checked' : '';
                    let sF = saved[i] === 'F' ? 'checked' : '';
                    
                    let iconStatus = "";
                    if (isLocked) {
                        let isCorrect = saved[i] === q.ans[i];
                        iconStatus = isCorrect ? `<i class="fa-solid fa-check text-emerald-500 ml-2"></i>` : `<i class="fa-solid fa-xmark text-rose-500 ml-2"></i>`;
                    }

                    html += `<tr class="border-b last:border-0 border-slate-200 dark:border-zinc-800 hover:bg-slate-50 dark:hover:bg-zinc-900/50 transition">
                                <td class="p-4 text-slate-800 dark:text-slate-200 font-medium leading-relaxed"><b>${rowLabels[i]})</b> ${opt} ${iconStatus}</td>
                                <td class="p-4 text-center bg-emerald-50/30 dark:bg-emerald-900/10 border-l border-slate-200 dark:border-zinc-800">
                                    <input type="radio" name="p2_${i}" value="T" onchange="saveAnswer2(${i}, 'T')" ${sT} ${isLocked?'disabled':''}>
                                </td>
                                <td class="p-4 text-center bg-rose-50/30 dark:bg-rose-900/10 border-l border-slate-200 dark:border-zinc-800">
                                    <input type="radio" name="p2_${i}" value="F" onchange="saveAnswer2(${i}, 'F')" ${sF} ${isLocked?'disabled':''}>
                                </td>
                             </tr>`;
                });
                html += `       </tbody>
                            </table>
                         </div>`;
            }
            // PHẦN 3: Ô ĐIỀN ĐÁP ÁN TRẢ LỜI NGẮN
            else if (q.type === 3) {
                let displayVal = saved.join('');
                html += `<div class="bg-slate-100 dark:bg-zinc-900 p-8 rounded-xl border border-slate-200 dark:border-zinc-800 flex flex-col sm:flex-row items-center justify-center gap-6 mt-6">
                            <span class="font-bold text-slate-700 dark:text-slate-300 text-xl tracking-wider">ĐÁP ÁN:</span>
                            <input type="text" id="p3-input" value="${displayVal}" oninput="saveAnswer3(this.value)" ${isLocked?'disabled':''}
                                class="w-full sm:w-64 px-4 py-3 text-center text-3xl font-black text-blue-600 dark:text-blue-400 bg-white dark:bg-black border-2 border-blue-400 dark:border-blue-600 rounded-lg shadow-inner outline-none focus:ring-4 focus:ring-blue-500/20 transition-all placeholder:text-slate-300" placeholder="---">
                         </div>`;
            }

            if (isLocked) {
                let correctAnsText = "";
                if (q.type === 2) {
                    let rowLabels = ['a', 'b', 'c', 'd'];
                    let corrects = q.ans.map((a, i) => `${rowLabels[i]}: ${a === 'T' ? 'Đúng' : 'Sai'}`).join(' | ');
                    correctAnsText = `<div class="mb-3 p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-lg border border-blue-200 dark:border-blue-800"><b>Đáp án chuẩn:</b> ${corrects}</div>`;
                } else if (q.type === 3) {
                    correctAnsText = `<div class="mb-3 p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-lg border border-blue-200 dark:border-blue-800"><b>Đáp án chuẩn:</b> ${q.ans}</div>`;
                }

                let s = calculateScore(q, currentIndex);
                let maxS = q.type === 1 ? (examConfig.p1_points || 0.25) : (q.type === 2 ? 1.0 : (examConfig.p3_points || 0.5));
                let scoreColor = s > 0 ? "text-emerald-600" : "text-rose-500";

                html += `
                <div class="mt-8 p-6 bg-slate-100 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-200 dark:border-zinc-800">
                        <b class="text-slate-700 dark:text-slate-300">Điểm đạt được:</b>
                        <span class="text-xl font-black ${scoreColor}">${s.toString().replace('.', ',')} / ${maxS.toString().replace('.', ',')}</span>
                    </div>
                    ${correctAnsText}
                    <b class="text-indigo-600 dark:text-indigo-400 mb-2 block uppercase text-sm font-bold mt-4">Giải thích chi tiết:</b>
                    <div class="whitespace-pre-line leading-relaxed text-sm sm:text-base text-slate-700 dark:text-slate-300">
                        ${q.explanation || 'Chưa có lời giải cho câu hỏi này.'}
                    </div>
                </div>`;
            }

            document.getElementById('question-container').innerHTML = html;
            if(window.MathJax) MathJax.typesetPromise();
        }

        function buildMinimap() {
            let html = ""; let p = 0;
            allQuestions.forEach((q, idx) => {
                if (q.p !== p) {
                    if (p !== 0) html += `</div></div>`;
                    let labels = q.p === 1 ? "Trắc nghiệm" : q.p === 2 ? "Đúng/Sai" : "Trả lời ngắn";
                    html += `<div class="mb-6"><div class="text-xs font-bold text-slate-500 uppercase mb-3">Phần ${q.p}: ${labels}</div><div class="flex flex-wrap gap-2">`;
                    p = q.p;
                }
                html += `<button id="nav-${idx}" onclick="goToQuestion(${idx})" class="w-10 h-10 text-xs font-bold rounded border bg-white dark:bg-zinc-900 border-slate-300 dark:border-zinc-700">${q.idx+1}</button>`;
            });
            html += `</div></div>`;
            document.getElementById('minimap-container').innerHTML = html;
        }

        function updateProgress() {
            let done = Object.keys(userAnswers).length;
            let pct = Math.round((done / allQuestions.length) * 100) || 0;
            document.getElementById('progress-text').innerText = `${pct}% (${done}/${allQuestions.length})`;
            document.getElementById('pb-completed').style.width = `${pct}%`;
            updateMinimapHighlight();
        }

        function updateMinimapHighlight() {
            allQuestions.forEach((q, idx) => {
                let btn = document.getElementById(`nav-${idx}`);
                if(!btn) return;
                
                if (!isExamFinished) {
                    let isDone = userAnswers[idx] !== undefined;
                    btn.className = `w-10 h-10 text-xs font-bold rounded transition-all flex items-center justify-center ${isDone ? 'bg-blue-500 text-white border-blue-600' : 'bg-white dark:bg-zinc-900 border-slate-300 dark:border-zinc-700 text-slate-500'}`;
                } else {
                    let s = calculateScore(q, idx);
                    let maxS = q.type === 1 ? (examConfig.p1_points || 0.25) : (q.type === 2 ? 1.0 : (examConfig.p3_points || 0.5));
                    let colorClass = s === maxS ? "bg-emerald-500 text-white border-emerald-600" : (s > 0 ? "bg-amber-500 text-white border-amber-600" : "bg-rose-500 text-white border-rose-600");
                    btn.className = `w-10 h-10 text-xs font-bold rounded transition-all flex items-center justify-center ${colorClass}`;
                }
                if(idx === currentIndex) btn.classList.add('ring-2', 'ring-offset-2', 'ring-blue-500', 'border-blue-500');
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if(isExamFinished) return; totalSecondsSpent++;
                let rem = timeLimitSeconds - totalSecondsSpent;
                if(rem <= 0) { clearInterval(timerInterval); finishExam(true); return; }
                document.getElementById('timer').innerText = `${Math.floor(rem/60).toString().padStart(2,'0')}:${(rem%60).toString().padStart(2,'0')}`;
            }, 1000);
        }

        function finishExam(force = false) {
            if(!force && !confirm("Nộp bài thi ngay?")) return;
            isExamFinished = true; clearInterval(timerInterval);
            
            if (document.exitFullscreen) { document.exitFullscreen().catch(err => {}); }
            
            let totalScore = 0;
            allQuestions.forEach((q, idx) => { totalScore += calculateScore(q, idx); });
            
            let m = Math.floor(totalSecondsSpent / 60).toString().padStart(2, '0');
            let s = (totalSecondsSpent % 60).toString().padStart(2, '0');
            
            let sidebarFooter = document.getElementById('sidebar-footer');
            sidebarFooter.innerHTML = `
                <div class="text-center p-2">
                    <div class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-2">ĐIỂM SỐ CUỐI CÙNG</div>
                    <div class="text-5xl font-black text-emerald-600 mb-4">${totalScore.toFixed(2).replace('.', ',')}</div>
                    <div class="text-sm font-medium text-slate-600 dark:text-slate-400">Thời gian làm bài: <span class="font-bold text-slate-800 dark:text-white">${m}:${s}</span></div>
                </div>
            `;
            
            updateMinimapHighlight();
            goToQuestion(currentIndex); 
            
            let dataHS = {};
            try { dataHS = JSON.parse(sessionStorage.getItem('DATA_HS') || '{}'); } catch(e) {}
            
            let urlParams = new URLSearchParams(window.location.search);
            let mon = urlParams.get('mon') || (examConfig ? examConfig.subject : "TOAN");
            
            let dbData = { 
               maHS: urlParams.get('maHS') || "GUEST", 
               tenHS: urlParams.get('tenHS') || "Khách", 
               lop: urlParams.get('lop') || "Chưa rõ", 
               maDe: urlParams.get('made') || "00000", 
               diemTN: totalScore.toFixed(2), 
               chiTiet: `Đã nộp bài. Thời gian: ${m}:${s}`, 
               mon: mon 
            };

            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler(res => {
                    if(!res.success) alert("Lỗi ghi dữ liệu: " + res.msg);
                }).withFailureHandler(err => {
                    console.log("Lỗi kết nối ghi điểm:", err);
                }).luuDiemTuDong(dbData);
            }
        }
    </script>
</body>
</html>
